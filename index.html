const end=g=>{clearInterval(GT);document.querySelectorAll(".opt").forEach(x=>{x.onclick=null;if(x.dataset.t==c[0])x.classList.add("ok")});g?(ok++,sOk()):sNo();setTimeout(()=>{i++;r()},1100)};
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const g=b.dataset.t==c[0];if(!g)b.classList.add("no");end(g)});
if(timed){let t=100;GT=setInterval(()=>{if(PZ)return;t--;$("#tb").style.width=t+"%";if(t==25)beep(900,.1);if(t<=0)end(0)},80)}})()}
function arena(P,pool,done,dir){const q=sh(P).slice(0,6);let i=0,ok=0,lv=3,it=[],sq=[],cl,lt=0,sp=0,over=0;
$("#g").innerHTML=`<div id="hud"></div><div id="clue"></div><div id="arena" class="${dir>0?"fall":""}"></div>`;const AR=$("#arena");
const hud=()=>$("#hud").innerHTML=`<span>Soru ${Math.min(i+1,q.length)}/${q.length}</span><span>${"❤️".repeat(Math.max(lv,0))}</span><span>⭐ ${ok}</span>`;
function nq(){it.forEach(e=>e.el.remove());it=[];if(i>=q.length||lv<=0){over=1;return done(Math.round(100*ok/q.length))}cl=q[i];$("#clue").textContent="🔎 "+cl[1];sq=sh([[cl[0],1],...sh(uq(pool.filter(x=>x[0]!=cl[0]))).slice(0,3).map(x=>[x[0],0])]);sp=.4;hud()}
function add(t,r){const e=document.createElement("div");e.className="fw"+(dir<0?" bl":"");e.textContent=t;e.style.background="hsl("+(Math.random()*360|0)+" 70% 42%)";AR.appendChild(e);e.style.left=Math.random()*Math.max(1,AR.clientWidth-e.offsetWidth)+"px";
const o={el:e,r,y:dir>0?-50:AR.clientHeight,v:dir*(60+i*9+Math.random()*25)};e.style.top=o.y+"px";
e.onpointerdown=()=>{if(PZ||over)return;if(r){ok++;i++;sOk();nq()}else{lv--;sNo();e.remove();it=it.filter(x=>x!=o);lv<=0?nq():hud()}};it.push(o)}
function loop(t){GR=requestAnimationFrame(loop);const dt=Math.min(.05,(t-lt)/1000);lt=t;if(PZ||over)return;
sp-=dt;if(sq.length&&sp<=0){const x=sq.shift();add(x[0],x[1]);sp=1.15}
for(const o of it.slice()){o.y+=o.v*dt;o.el.style.top=o.y+"px";if(dir>0?o.y>AR.clientHeight-4:o.y<-60){o.el.remove();it=it.filter(x=>x!=o);if(o.r){lv--;sNo();i++;nq();break}}}}
nq();lt=performance.now();GR=requestAnimationFrame(loop)}
function tf(P,pool,done){const q=sh(P).slice(0,6).map(c=>{const t=Math.random()<.5,o=sh(pool.filter(x=>x[1]!=c[1]))[0];return{s:c[0]+": "+(t?c[1]:o[1]),t}});let i=0,ok=0;(function r(){if(i>=q.length)return done(Math.round(100*ok/q.length));
$("#g").innerHTML=`<p>İfade ${i+1}/${q.length}</p><h2>${esc(q[i].s)}</h2><div class="grid"><button class="b4 a" data-v="1" style="font-size:1.5em">✔ Doğru</button><button class="b3 a" data-v="0" style="font-size:1.5em">✖ Yanlış</button></div>`;
document.querySelectorAll(".a").forEach(b=>b.onclick=()=>{document.querySelectorAll(".a").forEach(x=>x.onclick=null);const g=(b.dataset.v=="1")==q[i].t;if(g){ok++;sOk();b.classList.add("ok")}else{sNo();b.classList.add("no")}$("#g").insertAdjacentHTML("beforeend",`<p><b>${q[i].t?"Doğru ifade.":"Yanlış ifade: açıklama başka kavrama ait."}</b></p>`);setTimeout(()=>{i++;r()},1400)})})()}
function match(P,pool,done){const m=sh(P).slice(0,5);let L=null,err=0,left=m.length;const R=sh(m);
$("#g").innerHTML=`<h2>Kavramı açıklamasıyla eşleştir</h2><div class="grid"><div>${m.map(c=>`<button class="opt l" data-k="${esc(c[0])}">${esc(c[0])}</button>`).join("")}</div><div>${R.map(c=>`<button class="opt r" data-k="${esc(c[0])}">${esc(c[1])}</button>`).join("")}</div></div>`;
document.querySelectorAll(".l").forEach(b=>b.onclick=()=>{document.querySelectorAll(".l").forEach(x=>x.classList.remove("sel"));L=b;b.classList.add("sel");beep(500,.06)});
document.querySelectorAll(".r").forEach(b=>b.onclick=()=>{if(!L)return;if(L.dataset.k==b.dataset.k){sOk();L.classList.add("gone");b.classList.add("gone");L=null;if(!--left)setTimeout(()=>done(Math.max(0,100-15*err)),500)}else{err++;sNo();b.classList.add("no");setTimeout(()=>b.classList.remove("no"),400)}})}
// öğretmen paneli
function panel(){music(0);const c=C(),ks=Object.keys(c.sc);let h=`<div class="top"><h1>📊 ${esc(cur)} Paneli</h1><span><button onclick="csv()">⬇ CSV</button><button class="b3" onclick="reset()">Tümünü sıfırla</button><button onclick="setup()">⬅ Geri</button></span></div><div class="card" style="overflow:auto"><p>Hücreye tıklayarak puanı düzeltin (boş bırakırsanız silinir, “x” girmedi). Numaraya tıklayarak isim ekleyin.</p><table><tr><th>No</th><th>İsim</th>${ks.map(k=>{const[t,g]=k.split("|");return`<th>${t[0]=="U"?"Ünite "+t.slice(1):t}<br><small>${GN[g]}</small></th>`}).join("")}<th>Toplam</th></tr>`;
for(let n=1;n<=c.n;n++)h+=`<tr><td><b>${n}</b></td><td onclick="nm(${n})" style="cursor:pointer">${esc(c.nm[n]||"✎")}</td>${ks.map(k=>{const v=c.sc[k][n];return`<td onclick="ed('${k}',${n})" style="cursor:pointer">${v?(v.x?"girmedi":v.p):"·"}</td>`}).join("")}<td><b>${tot(c,n)}</b></td></tr>`;
A.innerHTML=h+"</table></div>"}
function nm(n){const v=prompt(n+". öğrencinin ismi:",C().nm[n]||"");if(v!==null){C().nm[n]=v.trim();save();panel()}}
function ed(k,n){const o=C().sc[k][n],v=prompt("Puan (0-100), “x” = girmedi, boş = sil:",o?(o.x?"x":o.p):"");if(v===null)return;const s=C().sc[k];if(v.trim()==="")delete s[n];else if(v.trim().toLowerCase()=="x")s[n]={x:1};else{const p=parseInt(v);if(isNaN(p))return;s[n]={p}}save();panel()}
function reset(){if(confirm(cur+" sınıfının tüm puanları silinsin mi?")){C().sc={};save();panel()}}
function csv(){const c=C(),ks=Object.keys(c.sc);let r=[["No","İsim",...ks.map(k=>k.replace("|"," ")),"Toplam"]];for(let n=1;n<=c.n;n++)r.push([n,c.nm[n]||"",...ks.map(k=>{const v=c.sc[k][n];return v?(v.x?"girmedi":v.p):""}),tot(c,n)]);
const b=new Blob(["\ufeff"+r.map(x=>x.map(y=>'"'+String(y).replace(/"/g,'""')+'"').join(",")).join("\n")],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=cur.replace(/[\/ ]/g,"_")+".csv";a.click()}

const FBC={apiKey:"AIzaSyBq7mt1Iqm1BI0T9KjlKuKL4pScVFlUow0",authDomain:"felsefe-mostem.firebaseapp.com",projectId:"felsefe-mostem",storageBucket:"felsefe-mostem.firebasestorage.app",messagingSenderId:"538963541273",appId:"1:538963541273:web:dba9f3e4ec7641fbf35988"};
const SYNC_MS=30*60*1000,FBV="https://www.gstatic.com/firebasejs/10.14.1/";
let FB=null,FP=null,FR=0,SM="⏳ Bağlanıyor…",busy=0;
if(D.hp!=="classes"){D.h={};D.hp="classes";save()}
const hs=s=>{let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return s.length+":"+h},
tmo=(p,ms=25000)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error("zaman aşımı")),ms))]),
enc=k=>encodeURIComponent(k);
const DOT=document.createElement("div");DOT.style.cssText="position:fixed;top:8px;left:8px;width:16px;height:16px;border-radius:50%;background:#e53935;border:2px solid #fff;box-shadow:0 2px 6px #0006;z-index:10;cursor:pointer;display:none";DOT.onclick=()=>{alert(SM);sync(1)};document.body.appendChild(DOT);
function setSt(m){SM=m;DOT.style.display=/^(📴|⚠️)/.test(m)?"block":"none";DOT.title=m}
function fbInit(){if(FP)return FP;FP=(async()=>{try{
const[a,fs]=await Promise.all([import(FBV+"firebase-app.js"),import(FBV+"firebase-firestore.js")]);
const app=a.initializeApp(FBC);FB={fs,db:fs.initializeFirestore(app,{experimentalForceLongPolling:true})};return FB}catch(e){FP=null;setSt("📴 Firebase yüklenemedi: "+(e.message||e));if(FR++<3)setTimeout(()=>sync(),15000);return null}})();return FP}
async function sync(manual){
if(busy)return;
const f=await fbInit();if(!f){if(manual)alert("Firebase yüklenemedi.");return}
busy=1;setSt("🔄 Eşitleniyor…");
try{
const{fs,db}=f,col=fs.collection(db,"classes"),snap=await tmo(fs.getDocs(col),20000),cl={},L={};
snap.forEach(d=>{const x=d.data();try{cl[x.name]=JSON.stringify(JSON.parse(x.data))}catch(e){}});
for(const k in D.c)L[k]=JSON.stringify(D.c[k]);
const op={push:[],pull:[],rmL:[],rmC:[],ok:[]};
new Set([...Object.keys(L),...Object.keys(cl)]).forEach(k=>{
const l=L[k],c=cl[k],has=k in D.h,dirty=!has||(l!==undefined&&hs(l)!==D.h[k]);
if(l!==undefined&&c!==undefined)l===c?op.ok.push(k):(dirty?op.push:op.pull).push(k);
else if(l!==undefined)(dirty?op.push:op.rmL).push(k);
else(has?op.rmC:op.pull).push(k)});
if(op.push.length||op.rmC.length){const b=fs.writeBatch(db);
op.push.forEach(k=>b.set(fs.doc(col,enc(k)),{name:k,data:L[k],u:Date.now()}));
op.rmC.forEach(k=>b.delete(fs.doc(col,enc(k))));
await tmo(b.commit())}
let ch=0;const now=k=>D.c[k]?JSON.stringify(D.c[k]):undefined;
op.ok.concat(op.push).forEach(k=>D.h[k]=hs(L[k]));
op.rmC.forEach(k=>delete D.h[k]);
op.pull.forEach(k=>{if(now(k)===L[k]){D.c[k]=JSON.parse(cl[k]);D.h[k]=hs(cl[k]);ch=1}});
op.rmL.forEach(k=>{if(now(k)===L[k]){delete D.c[k];delete D.h[k];ch=1}});
D.ls=Date.now();save();setSt("✅ Eşitlendi");
if(ch){if(cur&&!D.c[cur]){cur=null;home()}else if(!cur&&!document.activeElement.matches("input,select"))home()}
}catch(e){setSt("⚠️ Eşitleme olmadı: "+(e.code==="permission-denied"?"Firestore kurallarını kontrol edin":(e.code||"")+" "+(e.message||""))+" – veriler yerelde güvende")}
finally{busy=0}}
setInterval(()=>sync(),SYNC_MS);
addEventListener("online",()=>sync());
addEventListener("offline",()=>setSt("📴 Çevrimdışı – yerelde kaydediliyor"));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker"in navigator&&location.protocol.indexOf("http")==0)navigator.serviceWorker.register("sw.js").catch(()=>{});
setTimeout(()=>sync(),300);
home();
